<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Typography Portrait</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: monospace;
  }

  #loader {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    color: white;
    font-size: 24px;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0.2; }
  }
</style>
</head>

<body>

<div id="loader">Loading Face...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/geometries/TextGeometry.js"></script>

<script>

let scene, camera, renderer, controls;
let group = new THREE.Group();

init();
loadImageAndGenerate();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 100;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);

  scene.add(group);

  animate();
}

function loadImageAndGenerate() {

  const img = new Image();
  img.src = "profile.jpg"; 

  img.onload = () => {

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    const data = ctx.getImageData(0, 0, img.width, img.height).data;

    const loader = new THREE.FontLoader();

    loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(font) {

      for (let y = 0; y < img.height; y += 4) {
        for (let x = 0; x < img.width; x += 4) {

          const index = (y * img.width + x) * 4;

          const r = data[index];
          const g = data[index + 1];
          const b = data[index + 2];

          const brightness = (r + g + b) / 3;

          if (brightness > 120) {

            const char = "#"; // typography character

            const geometry = new THREE.TextGeometry(char, {
              font: font,
              size: 1,
              height: 0.5,
            });

            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });

            const mesh = new THREE.Mesh(geometry, material);

            mesh.position.x = x - img.width / 2;
            mesh.position.y = -(y - img.height / 2);

            // 🔥 Depth from brightness
            mesh.position.z = brightness * 0.2;

            group.add(mesh);
          }
        }
      }

      // hide loader after build
      document.getElementById("loader").style.display = "none";
    });
  };
}

function animate() {
  requestAnimationFrame(animate);

  group.rotation.y += 0.002;

  renderer.render(scene, camera);
}

</script>

</body>
</html>
