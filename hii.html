<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Face</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const img = new Image();
img.src = 'profile.jpg';

img.onload = () => {
  // Target display size — tall portrait filling most of screen
  const displayH = Math.floor(canvas.height * 0.92);
  const displayW = Math.floor(displayH * (img.width / img.height));

  const PIXEL_SIZE = 4; // size of each block in pixels
  const COLS = Math.floor(displayW / PIXEL_SIZE);
  const ROWS = Math.floor(displayH / PIXEL_SIZE);

  // Sample image into grid
  const offscreen = document.createElement('canvas');
  offscreen.width = COLS;
  offscreen.height = ROWS;
  const octx = offscreen.getContext('2d');
  octx.drawImage(img, 0, 0, COLS, ROWS);
  const data = octx.getImageData(0, 0, COLS, ROWS).data;

  const offsetX = Math.floor((canvas.width - COLS * PIXEL_SIZE) / 2);
  const offsetY = Math.floor((canvas.height - ROWS * PIXEL_SIZE) / 2);

  // Build all pixels
  const pixels = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const i = (row * COLS + col) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      // skip very bright background pixels
      if (brightness > 0.92) continue;
      const gray = Math.floor(brightness * 255);
      pixels.push({ col, row, gray, brightness });
    }
  }

  // Sort darkest first so face features (eyes, hair) appear first
  pixels.sort((a, b) => a.brightness - b.brightness);

  // Shuffle within brightness bands for organic reveal feel
  const BANDS = 60;
  const bandSize = Math.ceil(pixels.length / BANDS);
  for (let b = 0; b < BANDS; b++) {
    const start = b * bandSize;
    const end = Math.min(start + bandSize, pixels.length);
    for (let i = end - 1; i > start; i--) {
      const j = start + Math.floor(Math.random() * (i - start + 1));
      [pixels[i], pixels[j]] = [pixels[j], pixels[i]];
    }
  }

  let revealed = 0;
  const totalPixels = pixels.length;
  const batchSize = Math.ceil(totalPixels / 90);

  function draw() {
    const end = Math.min(revealed + batchSize, totalPixels);
    for (let i = revealed; i < end; i++) {
      const { col, row, gray } = pixels[i];
      const x = offsetX + col * PIXEL_SIZE;
      const y = offsetY + row * PIXEL_SIZE;
      ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
      ctx.fillRect(x, y, PIXEL_SIZE - 1, PIXEL_SIZE - 1);
    }
    revealed = end;
    if (revealed < totalPixels) requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
};
</script>
</body>
</html>
